<section id="shareStudio" class="panel share-panel" hidden><a id="returnActivity" href="index.html" class="share-return"><span aria-hidden="true">←</span> <span data-i18n="返回活动">返回活动</span></a><div class="panel-heading"><div><h2><span data-i18n="把这一程，留成一张图。">把这一程，留成一张图。</span></h2><p><span data-i18n="调整路线、配色与数据，制作你的分享图。">调整路线、配色与数据，制作你的分享图。</span></p></div><button id="exportShare" disabled><span data-i18n="保存高清 PNG">保存高清 PNG</span></button></div><div class="share-studio"><div class="share-controls"><label><span data-i18n="配色">配色</span><select id="shareTheme"><option value="ink" data-i18n="墨色 · 暗夜与荧光">墨色 · 暗夜与荧光</option><option value="paper" data-i18n="奶油 · 暖纸与赤陶">奶油 · 暖纸与赤陶</option><option value="mist" data-i18n="松绿 · 清新与自然">松绿 · 清新与自然</option></select></label><label><span data-i18n="画幅">画幅</span><select id="shareSize"><option value="portrait" data-i18n="竖版 · 1080 × 1350">竖版 · 1080 × 1350</option><option value="square" data-i18n="方形 · 1080 × 1080">方形 · 1080 × 1080</option><option value="story" data-i18n="长图 · 1080 × 1920">长图 · 1080 × 1920</option></select></label><label><span data-i18n="路线形态">路线形态</span><select id="shareRouteStyle"><option value="2d" data-i18n="平面路线">平面路线</option><option value="3d" data-i18n="三维海拔路线">三维海拔路线</option></select></label><div id="share3dControls" class="share-3d-controls" hidden><div class="share-3d-field"><label for="shareYaw" data-i18n="旋转">旋转</label><span class="share-value"><input id="shareYawValue" type="number" min="-180" max="180" step="1" value="-30" aria-label="旋转" data-i18n-aria-label="旋转"><span>°</span></span><input id="shareYaw" type="range" min="-180" max="180" step="1" value="-30"></div><div class="share-3d-field"><label for="sharePitch" data-i18n="俯视角">俯视角</label><span class="share-value"><input id="sharePitchValue" type="number" min="15" max="75" step="1" value="40" aria-label="俯视角" data-i18n-aria-label="俯视角"><span>°</span></span><input id="sharePitch" type="range" min="15" max="75" step="1" value="40"></div><div class="sh ta-i18n="展示路线">展示路线</span></label><label><input id="shareDate" type="checkbox" checked> <span data-i18n="展示日期">展示日期</span></label></div><div class="share-toggles"><label><input id="shareManufacturer" type="checkbox" aria-describedby="shareManufacturerHint"> <span data-i18n="显示码表厂商">显示码表厂商</span></label></div><p id="shareManufacturerHint" class="map-status"><span data-i18n="加载活动后识别记录设备厂商。">加载活动后识别记录设备厂商。</span></p><fieldset id="shareMetrics"><legend><span data-i18n="展示指标（最多 4 项）">展示指标（最多 4 项）</span></legend><label><input type="checkbox" value="time" checked> <span data-i18n="运动时间">运动时间</span></label><label><input type="checkbox" value="elapsed"> <span data-i18n="经过时长">经过时长</span></label><label><input type="checkbox" value="speed" checked> <span data-i18n="平均速度">平均速度</span></label><label><input type="checkbox" value="maxSpeed"> <span data-i18n="最快速度">最快速度</span></label><label><input type="checkbox" value="ascent" checked> <span data-i18n="累计爬升">累计爬升</span></label><label><input type="checkbox" value="descent"> <span data-i18n="累计下降">累计下降</span></label><label><input type="checkbox" value="maxAltitude"> <span data-i18n="最高海拔">最高海拔</span></label><label><input type="checkbox" value="minAltitude"> <span data-i18n="最低海拔">最低海拔</span></label><label><input type="checkbox" value="calories"> <span data-i18n="消耗热量">消耗热量</span></label><label><input type="checkbox" value="heartRate"> <span data-i18n="平均心率">平均心率</span></label><label><input type="checkbox" value="maxHeartRate"> <span data-i18n="最高心率">最高心率</span></label><label><input type="checkbox" value="cadence"> <span data-i18n="平均步频 / 踏频">平均步频 / 踏频</span></label><label><input type="checkbox" value="maxCadence"> <span data-i18n="最高步频 / 踏频">最高步频 / 踏频</span></label><label><input type="checkbox" value="power" checked> <span data-i18n="平均功率">平均功率</span></label><label><input type="checkbox" value="maxPower"> <span data-i18n="最高功率">最高功率</span></label><label><input type="checkbox" value="temperature"> <span data-i18n="平均温度">平均温度</span></label></fieldset><p id="shareStatus" class="map-status" role="status"><span data-i18n="预览随设置更新，图片使用当前加载的活动数据。">预览随设置更新，图片使用当前加载的活动数据。</span></p></div><div class="share-preview"><canvas id="shareCanvas" width="1080" height="1350" role="img" aria-label="运动分享图预览" data-i18n-aria-label="运动分享图预览"></canvas></div></div></section>
